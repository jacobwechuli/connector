services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PORTFOLIO_WORKTREE: /portfolio-worktree
    # Set PORTFOLIO_WORKTREE_HOST_PATH to the local checkout of the portfolio
    # repository. The fallback is this project's sample portfolio data.
    volumes:
      - ${PORTFOLIO_WORKTREE_HOST_PATH:-./portfolio}:/portfolio-worktree
  frontend:
    build:
      context: ./frontend
      args:
        # Next.js exposes this value to browser code at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
