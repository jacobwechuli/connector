[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-portfolio-maintainer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "sqlalchemy", "pydantic", "pydantic-settings", "httpx", "openai", "typer"]

[project.scripts]
portfolio-ai = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
